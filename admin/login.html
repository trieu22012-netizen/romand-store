<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập quản trị - ROMAND Beauty Store</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="login-wrap">
    <form class="login-box" data-form novalidate>
      <a class="brand" href="../" style="justify-content:center">
        <span class="logo">R</span>
        <span class="bname">ROMAND <em>Beauty</em></span>
      </a>
      <h2>Quản trị cửa hàng</h2>
      <div class="field" data-field="password">
        <label>Mật khẩu</label>
        <input type="password" name="password" placeholder="Nhập mật khẩu quản trị" />
        <div class="err">Mật khẩu không đúng</div>
      </div>
      <button class="btn btn-rose btn-block" type="submit">Đăng nhập</button>
      <p style="text-align:center;font-size:13px;color:var(--muted);margin-top:14px">Mật khẩu mặc định: <b>admin123</b></p>
      <a href="../" style="display:block;text-align:center;font-size:13px;color:var(--rose);margin-top:6px">← Về trang chủ</a>
    </form>
  </div>
  <script src="../js/store-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin-login.js"></script>
</body>
</html>
